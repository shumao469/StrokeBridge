[server]
headless = true
address = "127.0.0.1"
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 1

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#4C98C6"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EAF3F8"
textColor = "#243B53"
font = "sans serif"

